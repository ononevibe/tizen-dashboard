<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon US TV OS 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2230; --surface: #232c3b; --surface-2: #2b3547; --line: #35415a;
    --text: #e6eaf0; --muted: #8c97a8; --accent: #f2b84b; --ok: #6ccf8e; --err: #f07f7f;
    --radius: 10px;
    /* OS 색상 */
    --os-tizen: #4fb3ff; --os-webos: #c16bd9; --os-google: #6ccf8e; --os-android: #3f9d6b;
    --os-fire: #f2b84b; --os-roku: #a68cff; --os-smartcast: #ff8e6b; --os-vidaa: #59c9c0;
    --os-xumo: #e0a0c8; --os-whale: #7fa8ff; --os-titan: #ffb5d1; --os-unknown: #6b7688;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans KR", "Pretendard", -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; } a:hover { text-decoration: underline; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }

  .topbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .src { display: flex; gap: 8px; flex: 1 1 420px; }
  .src input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .src input::placeholder { color: var(--muted); }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1b2230; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .controls select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(108,207,142,.18); }
  .dot.error { background: var(--err); }
  .dot.loading { background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dot.loading { animation: none; } }

  .notice { margin-top: 20px; padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; }
  .notice.warn { border-color: var(--err); color: var(--text); }
  .notice b, .notice code { color: var(--text); }
  .hidden { display: none !important; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 22px; }
  .tab { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #1b2230; font-weight: 600; }
  .head { margin: 18px 0 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .head .sub { color: var(--muted); font-size: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .panel h2 small { color: var(--muted); font-weight: 400; margin-left: 8px; }

  /* 히어로: 점유율 바 */
  .hero .big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .hero .big b { font-size: 56px; font-weight: 600; line-height: 1; color: var(--os-tizen); letter-spacing: -0.02em; }
  .hero .big span { color: var(--muted); }
  .share { display: flex; height: 34px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .share div { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #121820; white-space: nowrap; overflow: hidden; min-width: 0; }
  .share div.tizen-seg { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .os-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
  .os-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; border-top: 3px solid var(--c); }
  .os-card.tizen { background: linear-gradient(180deg, rgba(79,179,255,.10), var(--surface)); }
  .os-card .name { font-weight: 600; }
  .os-card .n { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .os-card .m { color: var(--muted); font-size: 13px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 13px; padding-top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cell-bar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  tr.tizen-row td { background: rgba(79,179,255,.07); }
  .os-pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; color: #121820; font-weight: 500; background: var(--c); }
  .inf { color: var(--muted); font-size: 11px; margin-left: 4px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters select, .filters input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  .filters input { flex: 1; min-width: 160px; }
  .tbl-wrap { overflow-x: auto; max-height: 620px; overflow-y: auto; }
  .title-cell { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--text); }
  th.sorted { color: var(--text); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; font-size: 14px; }

  .trend svg { width: 100%; height: 220px; display: block; overflow: visible; }
  .trend .axis { stroke: var(--line); stroke-width: 1; }
  .trend text { fill: var(--muted); font-size: 11px; }

  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
    .hero .big b { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <form class="src" id="srcForm">
      <input id="srcInput" type="text" placeholder="owner/repo  또는  JSON 파일 URL" autocomplete="off" spellcheck="false" aria-label="데이터 소스">
      <button class="btn primary" type="submit">연결</button>
      <label class="btn ghost" title="로컬 tv-os.json 파일로 미리보기">파일 열기<input id="fileInput" type="file" accept=".json" hidden></label>
    </form>
    <div class="controls">
      <label>자동 갱신
        <select id="interval">
          <option value="300000">5분</option>
          <option value="600000" selected>10분</option>
          <option value="1800000">30분</option>
          <option value="0">끄기</option>
        </select>
      </label>
      <button class="btn" id="refreshBtn" type="button">지금 새로고침</button>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">데이터 소스를 연결하세요</span></div>
    </div>
  </header>

  <div id="notice" class="notice hidden"></div>

  <main id="main" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div class="head">
      <h1 id="title">TV OS 현황</h1>
      <span class="sub" id="subInfo"></span>
    </div>

    <section class="panel hero">
      <h2>검색 결과 내 OS 점유율 <small id="heroNote"></small></h2>
      <div class="big"><b id="tizenShare">–</b><span>Tizen 비중 (<span id="tizenCount"></span>)</span></div>
      <div class="share" id="shareBar"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="os-cards" id="osCards"></section>

    <section class="grid2">
      <div class="panel">
        <h2>브랜드별 OS 분포</h2>
        <div class="tbl-wrap"><table id="brandTable"></table></div>
      </div>
      <div class="panel">
        <h2>가격대별 OS 분포 <small id="curLabel"></small></h2>
        <div class="tbl-wrap"><table id="priceTable"></table></div>
      </div>
    </section>

    <section class="panel trend" style="margin-top:20px">
      <h2>OS 비중 추이 <small id="trendNote"></small></h2>
      <div id="trend"></div>
    </section>

    <section class="panel" style="margin-top:20px">
      <h2>제품 목록 <small id="listCount"></small></h2>
      <div class="filters">
        <select id="fOS"><option value="">모든 OS</option></select>
        <select id="fBrand"><option value="">모든 브랜드</option></select>
        <select id="fQuery"><option value="">모든 검색어</option></select>
        <input id="fText" type="search" placeholder="제품명 검색">
      </div>
      <div class="tbl-wrap"><table id="prodTable"></table></div>
    </section>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = n => Number(n ?? 0).toLocaleString('ko-KR');
  let SYM = '$';
  const usd = n => n == null ? '–' : SYM + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  const OS_COLOR = { 'Tizen': 'var(--os-tizen)', 'webOS': 'var(--os-webos)', 'Google TV': 'var(--os-google)', 'Android TV': 'var(--os-android)', 'Fire TV': 'var(--os-fire)', 'Roku TV': 'var(--os-roku)', 'SmartCast': 'var(--os-smartcast)', 'VIDAA': 'var(--os-vidaa)', 'Xumo TV': 'var(--os-xumo)', 'WhaleOS': 'var(--os-whale)', 'Titan OS': 'var(--os-titan)', 'Unknown': 'var(--os-unknown)' };
  const color = os => OS_COLOR[os] || 'var(--os-unknown)';
  const BANDS = {
    default: [[0,300],[300,600],[600,1000],[1000,2000],[2000,Infinity]],
    JPY: [[0,50000],[50000,100000],[100000,150000],[150000,300000],[300000,Infinity]],
    INR: [[0,25000],[25000,50000],[50000,100000],[100000,200000],[200000,Infinity]],
  };
  const priceBands = cur => (BANDS[cur] || BANDS.default).map(([lo, hi]) => [lo, hi, hi === Infinity ? `${usd(lo)} 이상` : lo === 0 ? `${usd(hi)} 미만` : `${usd(lo)}–${usd(hi - 1)}`]);

  let source = null, timer = null, data = null, histData = [], sort = { key: 'position', dir: 1 };
  let markets = [], market = new URLSearchParams(location.search).get('m') || null;

  function setStatus(kind, text) { $('dot').className = 'dot ' + kind; $('statusText').textContent = text; }
  function notice(html, warn) { const n = $('notice'); n.innerHTML = html; n.classList.remove('hidden'); n.classList.toggle('warn', !!warn); }
  function hideNotice() { $('notice').classList.add('hidden'); }

  // ---------- 소스 해석 ----------
  function resolveSource(v) {
    v = v.trim();
    if (!v) return null;
    if (/^https?:\/\//.test(v)) {
      let m = v.match(/^https?:\/\/github\.com\/([\w.-]+)\/([\w.-]+)(?:\/blob\/([\w.-]+)\/(.+))?/);
      if (m) return m[4] ? { base: `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}/${m[4].replace(/[^/]*$/, '')}`, label: `${m[1]}/${m[2]}` } : fromRepo(m[1], m[2], 'main');
      return { base: v.replace(/[^/]*$/, ''), label: v.replace(/^https?:\/\//, '').slice(0, 60) };
    }
    const m = v.replace(/\.git$/, '').match(/^([\w.-]+)\/([\w.-]+)(?:@([\w.-]+))?$/);
    return m ? fromRepo(m[1], m[2], m[3] || 'main') : null;
  }
  function fromRepo(o, r, b) {
    return { base: `https://raw.githubusercontent.com/${o}/${r}/${b}/data/`, label: `${o}/${r}` };
  }

  async function load() {
    if (!source) return;
    setStatus('loading', '불러오는 중…');
    try {
      const bust = '?t=' + Date.now();
      const get = (path, opt) => fetch(source.base + path + bust, { cache: 'no-store' }).then(r => { if (!r.ok) { if (opt) return null; throw new Error(`HTTP ${r.status}`); } return r.json(); }).catch(e => { if (opt) return null; throw e; });
      const idx = await get('index.json', true);
      markets = idx?.markets || [];
      let dir = '';
      if (markets.length) {
        if (!market || !markets.some(m => m.code === market)) market = markets[0].code;
        dir = market + '/';
      }
      renderTabs();
      const [d, h] = await Promise.all([get(dir + 'tv-os.json'), get(dir + 'history.json', true)]);
      render(d, Array.isArray(h) ? h : []);
      hideNotice();
      setStatus('live', `${new Date().toLocaleTimeString('ko-KR')} 갱신 · ${source.label}`);
    } catch (e) {
      setStatus('error', '불러오기 실패');
      notice(`데이터를 불러오지 못했습니다 (${esc(e.message)}). 저장소가 공개 상태인지, <code>data/tv-os.json</code>이 있는지 확인해주세요. Actions가 아직 한 번도 실행되지 않았다면 Actions 탭에서 수동 실행해보세요.`, true);
    }
  }

  // ---------- 렌더 ----------
  function renderTabs() {
    const t = $('tabs');
    t.classList.toggle('hidden', markets.length < 2);
    t.innerHTML = markets.map(m => `<button type="button" class="tab ${m.code === market ? 'on' : ''}" data-code="${esc(m.code)}">${esc(m.label)}</button>`).join('');
    t.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      market = b.dataset.code;
      const url = new URL(location.href); url.searchParams.set('m', market); window.history.replaceState(null, '', url);
      load();
    }));
  }

  function render(d, h) {
    data = d; histData = h;
    SYM = d.symbol || (d.currency === 'GBP' ? '£' : d.currency === 'EUR' ? '€' : '$');
    $('title').textContent = `${d.label || 'Amazon US'} · TV OS 현황`;
    $('curLabel').textContent = d.currency || 'USD';
    const P = d.products || [];
    const total = P.length;
    const counts = {};
    P.forEach(p => counts[p.os] = (counts[p.os] || 0) + 1);
    const osList = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

    $('subInfo').textContent = `수집 ${new Date(d.generated_at).toLocaleString('ko-KR')} · ${d.marketplace || ''} · 제품 ${num(total)}개` + (d.source === 'sample' ? ' · 샘플 데이터' : '');
    $('heroNote').textContent = (d.queries || []).length ? `검색어 ${d.queries.length}개 기준` : '';

    // 히어로
    const tz = counts['Tizen'] || 0;
    $('tizenShare').textContent = total ? (tz / total * 100).toFixed(1) + '%' : '–';
    $('tizenCount').textContent = `${num(tz)} / ${num(total)}`;
    $('shareBar').innerHTML = osList.map(os => {
      const pct = counts[os] / total * 100;
      return `<div class="${os === 'Tizen' ? 'tizen-seg' : ''}" style="width:${pct}%;background:${color(os)}" title="${esc(os)} ${counts[os]}개 (${pct.toFixed(1)}%)">${pct >= 9 ? esc(os) + ' ' + pct.toFixed(0) + '%' : ''}</div>`;
    }).join('');
    $('legend').innerHTML = osList.map(os => `<span><i style="background:${color(os)}"></i>${esc(os)} ${counts[os]}</span>`).join('');

    // OS 카드
    $('osCards').innerHTML = osList.map(os => {
      const ps = P.filter(p => p.os === os);
      const prices = ps.map(p => p.price).filter(Boolean);
      const avg = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : null;
      const rated = ps.filter(p => p.rating);
      const rating = rated.length ? (rated.reduce((a, p) => a + p.rating, 0) / rated.length).toFixed(2) : '–';
      const bestPos = Math.min(...ps.map(p => p.position || 999));
      return `<div class="os-card ${os === 'Tizen' ? 'tizen' : ''}" style="--c:${color(os)}">
        <div class="name">${esc(os)}</div>
        <div class="n">${num(counts[os])}<span class="m"> 개</span></div>
        <div class="m">평균 ${usd(avg)} · 평점 ${rating}</div>
        <div class="m">최고 순위 #${bestPos === 999 ? '–' : bestPos}</div>
      </div>`;
    }).join('');

    // 브랜드 × OS
    const brands = {};
    P.forEach(p => { const b = p.brand || '(미상)'; brands[b] = brands[b] || {}; brands[b][p.os] = (brands[b][p.os] || 0) + 1; });
    const brandRows = Object.entries(brands).map(([b, m]) => [b, m, Object.values(m).reduce((a, c) => a + c, 0)]).sort((a, b) => b[2] - a[2]);
    const maxB = Math.max(1, ...brandRows.map(r => r[2]));
    $('brandTable').innerHTML = `<thead><tr><th>브랜드</th><th class="num">모델</th><th>OS</th></tr></thead><tbody>` +
      brandRows.map(([b, m, n]) => `<tr>
        <td>${esc(b)}</td>
        <td class="num"><span class="cell-bar" style="width:${n / maxB * 60}px;background:var(--surface-2)"></span>${n}</td>
        <td>${Object.entries(m).sort((a, b) => b[1] - a[1]).map(([os, c]) => `<span class="os-pill" style="--c:${color(os)}">${esc(os)} ${c}</span>`).join(' ')}</td>
      </tr>`).join('') + '</tbody>';

    // 가격대 × OS
    const bandRows = priceBands(d.currency).map(([lo, hi, label]) => {
      const ps = P.filter(p => p.price != null && p.price >= lo && p.price < hi);
      const m = {}; ps.forEach(p => m[p.os] = (m[p.os] || 0) + 1);
      return [label, ps.length, m];
    });
    const maxP = Math.max(1, ...bandRows.map(r => r[1]));
    $('priceTable').innerHTML = `<thead><tr><th>가격대</th><th class="num">모델</th><th>구성</th></tr></thead><tbody>` +
      bandRows.map(([label, n, m]) => `<tr>
        <td>${label}</td>
        <td class="num"><span class="cell-bar" style="width:${n / maxP * 60}px;background:var(--surface-2)"></span>${n}</td>
        <td>${n ? `<div class="share" style="height:14px;border-radius:4px">${osList.filter(os => m[os]).map(os => `<div style="width:${m[os] / n * 100}%;background:${color(os)}" title="${esc(os)} ${m[os]}"></div>`).join('')}</div>` : '<span class="empty" style="padding:0">–</span>'}</td>
      </tr>`).join('') + '</tbody>';

    renderTrend(osList);
    setupFilters(P, osList);
    renderProducts();
  }

  function renderTrend(osList) {
    const H = histData.filter(h => h.total);
    const box = $('trend');
    if (H.length < 2) {
      $('trendNote').textContent = '';
      box.innerHTML = `<div class="empty">수집이 2회 이상 쌓이면 일자별 OS 비중 변화가 여기에 표시됩니다.${H.length ? ` (현재 ${H.length}일)` : ''}</div>`;
      return;
    }
    $('trendNote').textContent = `${H[0].date} ~ ${H[H.length - 1].date}`;
    const W = 1000, HT = 200, padL = 40, padB = 24, padT = 10;
    const x = i => padL + (i / (H.length - 1)) * (W - padL - 10);
    const maxPct = Math.max(10, ...H.flatMap(h => osList.map(os => (h.os_counts[os] || 0) / h.total * 100)));
    const y = v => padT + (1 - v / maxPct) * (HT - padT - padB);
    const lines = osList.map(os => {
      const pts = H.map((h, i) => `${x(i).toFixed(1)},${y((h.os_counts[os] || 0) / h.total * 100).toFixed(1)}`).join(' ');
      return `<polyline fill="none" stroke="${color(os)}" stroke-width="${os === 'Tizen' ? 3 : 1.5}" points="${pts}"/>`;
    }).join('');
    const ticks = [0, maxPct / 2, maxPct].map(v => `<line class="axis" x1="${padL}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(0)}%</text>`).join('');
    const step = Math.ceil(H.length / 8);
    const xl = H.map((h, i) => i % step === 0 || i === H.length - 1 ? `<text x="${x(i)}" y="${HT - 6}" text-anchor="middle">${h.date.slice(5)}</text>` : '').join('');
    box.innerHTML = `<svg viewBox="0 0 ${W} ${HT}" preserveAspectRatio="none">${ticks}${lines}${xl}</svg>`;
  }

  function setupFilters(P, osList) {
    const fill = (id, vals, cur) => { const s = $(id); const first = s.options[0].outerHTML; s.innerHTML = first + vals.map(v => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join(''); };
    fill('fOS', osList, $('fOS').value);
    fill('fBrand', [...new Set(P.map(p => p.brand).filter(Boolean))].sort(), $('fBrand').value);
    fill('fQuery', [...new Set(P.map(p => p.query).filter(Boolean))], $('fQuery').value);
  }

  function renderProducts() {
    if (!data) return;
    const fo = $('fOS').value, fb = $('fBrand').value, fq = $('fQuery').value, ft = $('fText').value.toLowerCase();
    let rows = (data.products || []).filter(p => (!fo || p.os === fo) && (!fb || p.brand === fb) && (!fq || p.query === fq) && (!ft || (p.title || '').toLowerCase().includes(ft)));
    rows.sort((a, b) => { const va = a[sort.key] ?? (sort.dir > 0 ? Infinity : -Infinity), vb = b[sort.key] ?? (sort.dir > 0 ? Infinity : -Infinity); return (va > vb ? 1 : va < vb ? -1 : 0) * sort.dir; });
    $('listCount').textContent = `${num(rows.length)}개`;
    const th = (key, label, cls = '') => `<th class="sortable ${cls} ${sort.key === key ? 'sorted' : ''}" data-key="${key}">${label}${sort.key === key ? (sort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
    $('prodTable').innerHTML = `<thead><tr>${th('position', '순위', 'num')}<th>제품</th><th>브랜드</th><th>OS</th>${th('size', '크기', 'num')}${th('price', '가격', 'num')}${th('rating', '평점', 'num')}${th('ratings_total', '리뷰', 'num')}<th>검색어</th></tr></thead><tbody>` +
      (rows.length ? rows.map(p => `<tr class="${p.os === 'Tizen' ? 'tizen-row' : ''}">
        <td class="num">${p.position ?? '–'}</td>
        <td class="title-cell"><a href="${esc(p.url || '#')}" target="_blank" rel="noopener" title="${esc(p.title)}">${esc(p.title)}</a>${p.bestseller ? ' <span class="inf">베스트셀러</span>' : ''}</td>
        <td>${esc(p.brand)}</td>
        <td><span class="os-pill" style="--c:${color(p.os)}">${esc(p.os)}</span>${p.os_inferred ? '<span class="inf" title="제품명에 OS 표기가 없어 브랜드로 추정">추정</span>' : ''}</td>
        <td class="num">${p.size ? p.size + '"' : '–'}</td>
        <td class="num">${usd(p.price)}</td>
        <td class="num">${p.rating ?? '–'}</td>
        <td class="num">${p.ratings_total ? num(p.ratings_total) : '–'}</td>
        <td>${esc(p.query || '')}</td>
      </tr>`).join('') : '<tr><td colspan="9" class="empty">조건에 맞는 제품이 없습니다</td></tr>') + '</tbody>';
    $('prodTable').querySelectorAll('th.sortable').forEach(el => el.addEventListener('click', () => {
      const k = el.dataset.key; sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: k === 'position' ? 1 : -1 }; renderProducts();
    }));
  }

  // ---------- 이벤트 ----------
  function connect(v) {
    const s = resolveSource(v);
    if (!s) { notice('<b>owner/repo</b> 형식이나 JSON 파일 URL을 입력해주세요. 브랜치를 지정하려면 <b>owner/repo@branch</b>.', true); return; }
    source = s; hideNotice();
    const url = new URL(location.href); url.searchParams.set('src', v.trim()); window.history.replaceState(null, '', url);
    $('main').classList.remove('hidden');
    load(); schedule();
  }
  function schedule() { clearInterval(timer); timer = null; const ms = +$('interval').value; if (ms > 0 && source) timer = setInterval(load, ms); }

  $('srcForm').addEventListener('submit', e => { e.preventDefault(); connect($('srcInput').value); });
  $('refreshBtn').addEventListener('click', load);
  $('interval').addEventListener('change', schedule);
  ['fOS', 'fBrand', 'fQuery'].forEach(id => $(id).addEventListener('change', renderProducts));
  $('fText').addEventListener('input', renderProducts);
  $('fileInput').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); source = null; clearInterval(timer); $('main').classList.remove('hidden'); render(d, []); hideNotice(); setStatus('live', `로컬 파일 · ${f.name}`); }
    catch { notice('JSON 파일을 읽을 수 없습니다. collect.py가 만든 <code>tv-os.json</code>인지 확인해주세요.', true); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && source) load(); });

  // GitHub Pages(owner.github.io/repo/)에 올려두면 자기 저장소를 자동으로 연결
  const gh = location.hostname.match(/^([\w-]+)\.github\.io$/);
  const autoSrc = gh && location.pathname.split('/')[1] ? `${gh[1]}/${location.pathname.split('/')[1]}` : null;
  const initial = new URLSearchParams(location.search).get('src') || autoSrc;
  if (initial) { $('srcInput').value = initial; connect(initial); }
  else notice('이 파일이 들어 있는 GitHub 저장소를 <b>owner/repo</b>로 입력하면 <code>data/tv-os.json</code>을 읽어 표시하고, 선택한 간격으로 자동 갱신합니다. GitHub 없이 확인만 하려면 <b>파일 열기</b>로 <code>data/tv-os.json</code>을 불러오세요.');
})();
</script>
</body>
</html>
