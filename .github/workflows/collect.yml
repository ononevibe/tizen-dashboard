name: Collect Amazon US TV OS data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run collector
        env:
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
          MARKETPLACES: ${{ vars.MARKETPLACES }}
          SEARCH_TERMS: ${{ vars.SEARCH_TERMS }}
          PAGES_PER_TERM: ${{ vars.PAGES_PER_TERM }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "tv-os-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
