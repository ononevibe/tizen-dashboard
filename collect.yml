name: Collect Amazon US TV OS data

on:
  schedule:
    - cron: "0 */6 * * *"      # 6시간마다 (UTC)
  workflow_dispatch:           # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run collector
        env:
          # Settings → Secrets and variables → Actions 에 등록
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
          # 검색어는 쉼표로 구분. 비우면 스크립트 기본값 사용
          SEARCH_TERMS: ${{ vars.SEARCH_TERMS }}
          # 검색어당 페이지 수 (크레딧 절약을 위해 기본 1)
          PAGES_PER_TERM: ${{ vars.PAGES_PER_TERM }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "tv-os-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
